name: Fork diff

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

jobs:
  fork-diff:
    uses: intisy/workflows/.github/workflows/fork-diff.yml@main
    with:
      baseline_ref: upstream-0.15.0
      marker: 'Modified 2026 by the Brazier project'
      # Upstream's README is deleted rather than edited, because this organisation generates a README
      # onto the default branch from CONTENT.md and a docs config.
      allow_deleted: |
        README.md
