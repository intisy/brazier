name: Merge

on:
  workflow_dispatch:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  merge:
    uses: intisy/workflows/.github/workflows/merge.yml@main
    with:
      source: development
      target: main
      sync_back: true
      # README.md exists only on main, where the generator writes it. Without this the merge would
      # carry development's deletion of it across and undo every generator run.
      generated_paths: README.md
