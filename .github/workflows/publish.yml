name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, with or without a leading v'
        required: true
        type: string

# A called workflow cannot hold more permission than its caller, and this one writes the Pages branch.
permissions:
  contents: write

jobs:
  publish:
    uses: intisy/workflows/.github/workflows/publish-maven-repo.yml@main
    with:
      # Upstream already stages a Maven layout when no publish URL is set, so the build needed no
      # change for this: the repository is renamed, its destination is not.
      gradle_task: publishAllPublicationsToBrazierRepository
      # github.event.inputs rather than inputs, because the inputs context does not exist on a push.
      version: ${{ github.event.inputs.version || github.ref_name }}
      version_property: brazier.project.version
      java_version: '17'
      timeout_minutes: 90
